name: Fetch Conversion Rates

on:
  # Run automatically every 30 minutes
  schedule:
    - cron: '*/30 * * * *'
  
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      baseCurrency:
        description: 'Base Currency (default: USD)'
        required: false
        default: 'USD'
      termCurrency:
        description: 'Term Currency (default: BDT)'
        required: false
        default: 'BDT'

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Fetch conversion rates
        env:
          BASE_CURRENCY: ${{ github.event.inputs.baseCurrency || 'USD' }}
          TERM_CURRENCY: ${{ github.event.inputs.termCurrency || 'BDT' }}
        run: |
          echo "Fetching conversion rates..."
          bash fetch-rates.sh
          echo "✓ Fetch script completed"
      
      - name: Debug - Show repository status
        run: |
          echo "=== Git Status ==="
          git status
          echo ""
          echo "=== Data Directory Contents ==="
          ls -la data/
          echo ""
          echo "=== Git Diff ==="
          git diff data/
      
      - name: Stage changes to data directory
        run: |
          echo "Staging changes in data/ directory..."
          git add data/
          echo "✓ Changes staged"
      
      - name: Check for changes
        id: git-check
        run: |
          if git diff --cached --exit-code data/; then
            echo "No changes detected"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected in data/ directory"
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Create Pull Request
        if: steps.git-check.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Update conversion rates - ${{ github.event.inputs.baseCurrency || 'USD' }} to ${{ github.event.inputs.termCurrency || 'BDT' }}"
          title: "Update conversion rates - ${{ github.event.inputs.baseCurrency || 'USD' }} to ${{ github.event.inputs.termCurrency || 'BDT' }}"
          body: |
            ## Automated Conversion Rate Update
            
            This PR updates the conversion rates data fetched from the iFAST GB API.
            
            - **Base Currency**: ${{ github.event.inputs.baseCurrency || 'USD' }}
            - **Term Currency**: ${{ github.event.inputs.termCurrency || 'BDT' }}
            - **Workflow Run**: ${{ github.run_number }}
            
            ### Changes
            - Updated CSV data file with latest rates
            
            This PR will be automatically merged if all checks pass.
          branch: update-conversion-rates-${{ github.run_number }}
          delete-branch: true
          labels: |
            automated
            conversion-rates
      
      - name: Enable Pull Request Automerge
        if: steps.git-check.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Wait a moment for PR to be created
          sleep 5
          
          # Get the PR number
          PR_NUMBER=$(gh pr list --head update-conversion-rates-${{ github.run_number }} --json number --jq '.[0].number')
          
          if [ -n "$PR_NUMBER" ]; then
            echo "Enabling auto-merge for PR #$PR_NUMBER"
            gh pr merge $PR_NUMBER --auto --merge --delete-branch
          else
            echo "No PR found to auto-merge"
          fi
      
      - name: No changes detected
        if: steps.git-check.outputs.changed != 'true'
        run: echo "No changes in conversion rates - skipping PR creation"
